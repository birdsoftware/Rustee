<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truck CAN / Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e5f7ff; background: #071014; }
    body { margin: 0; padding: 24px; background: linear-gradient(135deg, #071014, #10242b); }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .muted { color: #98b7c2; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 18px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
    .label { color: #9fc2cc; font-size: 14px; }
    .value { font-size: 34px; font-weight: 700; margin-top: 6px; }
    .unit { font-size: 16px; color: #9fc2cc; }
    .chartBox { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 18px; }
    .status { margin-top: 14px; color: #9fc2cc; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Truck CAN / Sensor Dashboard</h1>
    <div class="muted">Latest reading plus last 24 hours</div>

    <div class="cards">
      <div class="card"><div class="label">Temp C</div><div class="value"><span id="tempC">--</span> <span class="unit">°C</span></div></div>
      <div class="card"><div class="label">Temp F</div><div class="value"><span id="tempF">--</span> <span class="unit">°F</span></div></div>
      <div class="card"><div class="label">Humidity</div><div class="value"><span id="humidity">--</span> <span class="unit">%</span></div></div>
      <div class="card"><div class="label">Last Updated</div><div class="value" style="font-size:22px" id="lastUpdated">--</div></div>
    </div>

    <div class="chartBox">
      <canvas id="historyChart"></canvas>
      <div class="status" id="status">Loading...</div>
    </div>
  </div>

  <script>
    // Paste your Apps Script Web App /exec URL here.
    const API_URL = "https://script.google.com/macros/s/AKfycbwnEGUfpvk-a3wJgBwrIRM6s1DaAasQKaMLhyy6VEVmq5pvRBiERz3GNtwLoKmrr3K8/exec";

    const ctx = document.getElementById("historyChart");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [
          { label: "Temp F", data: [], tension: 0.25 },
          { label: "Humidity", data: [], tension: 0.25 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: "#e5f7ff" } } },
        scales: {
          x: { ticks: { color: "#9fc2cc", maxTicksLimit: 8 }, grid: { color: "rgba(255,255,255,.08)" } },
          y: { ticks: { color: "#9fc2cc" }, grid: { color: "rgba(255,255,255,.08)" } }
        }
      }
    });

    function fmtTime(value) {
      return new Date(value).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function loadData() {
  const old = document.getElementById("jsonpScript");
  if (old) old.remove();

  window.handleSensorData = function(json) {
    const rows = json.rows || [];

    if (!rows.length) {
      document.getElementById("status").textContent = "No readings found yet.";
      return;
    }

    const latest = rows[rows.length - 1];

    document.getElementById("tempC").textContent = latest.tempC;
    document.getElementById("tempF").textContent = latest.tempF;
    document.getElementById("humidity").textContent = latest.humidity;
    document.getElementById("lastUpdated").textContent =
      new Date(latest.timestamp).toLocaleString();

    chart.data.labels = rows.map(r =>
      new Date(r.timestamp).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    );
    chart.data.datasets[0].data = rows.map(r => Number(r.tempF));
    chart.data.datasets[1].data = rows.map(r => Number(r.humidity));
    chart.update();

    document.getElementById("status").textContent =
      `Showing ${rows.length} readings from the last 24 hours.`;
  };

  const script = document.createElement("script");
  script.id = "jsonpScript";
  script.src = API_URL + "?callback=handleSensorData&cacheBust=" + Date.now();
  document.body.appendChild(script);
}

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
